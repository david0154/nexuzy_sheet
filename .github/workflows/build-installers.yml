name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  installers:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller huggingface_hub>=0.25.0

      - name: Install Windows installer tool
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
          sudo apt-get install -y appimagetool || true

      - name: Build installers
        run: python build_installers.py --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: nexuzy-sheet-${{ matrix.platform }}
          path: dist/installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release with all platform installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nexuzy Sheet ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            artifacts/*/*
